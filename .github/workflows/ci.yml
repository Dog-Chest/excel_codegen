# 多平台回归：同一份 uv.lock 在三个系统上装出来的环境应当一致。
#
# 这个文件是**可选**的 —— 没有 GitHub 也能用，本地等价命令就是：
#     uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest --cov
# （见 README「安装」里的 uv 一节）。放在这里是为了把"多平台无缝 + 不许回归"变成可自动复查的事实：
# 任何一次改动，三个系统 × 两个 Python 版本都会跑一遍 194 项测试、lint、类型检查与覆盖率门槛。
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 = pyproject 里的支持下限（必须测，否则"支持 3.11"只是嘴上说说）；
        # 3.13 = 较新版本。开发默认解释器是 .python-version 里的 3.12。
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 锁文件必须与 pyproject.toml 同步（改了依赖忘了 uv lock 会在这里失败）
      - name: 校验 uv.lock 与 pyproject.toml 一致
        run: uv lock --check

      # 只用矩阵里的解释器跑一次就够（下面的检查与 OS / 版本关系不大），
      # 但让每个任务都跑也无妨：命令都是秒级。
      - name: lint（ruff check）
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: 格式（ruff format --check）
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: 类型（mypy）
        run: uv run --python ${{ matrix.python }} mypy

      # 测试 + 覆盖率门槛（fail_under 写在 pyproject.toml 的 [tool.coverage.report] 里）
      - name: 测试 + 覆盖率
        run: uv run --python ${{ matrix.python }} pytest --cov

      - name: CLI 冒烟
        run: uv run --python ${{ matrix.python }} spreadsheet-codegen --version

      # 守卫：sdist 必须自包含 —— 解包后能直接跑测试、内置示例能拷出来用。
      # 这条曾经真的坏过：setuptools 默认只收 test*.py，把 tests/conftest.py 漏了，
      # 于是 sdist 里躺着一套"所有 fixture 都找不到"的测试。
      - name: 验证 sdist 自包含（解包后跑测试 + 校验内置示例）
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv build --sdist
          mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/spreadsheet_codegen-*
          test -f tests/conftest.py || { echo "::error::sdist 里缺少 tests/conftest.py"; exit 1; }
          # setup.sh：docs/setup.md 让人跑它，tests/test_setup_script.py 也执行它
          test -f setup.sh || { echo "::error::sdist 里缺少 setup.sh"; exit 1; }
          # 示例是包数据：连 abs_fpi 的 .j2 模板都要在（漏了 *.j2 示例就解不开）
          test -f spreadsheet_codegen/examples/abs_fpi/templates/int_body.js.j2 \
            || { echo "::error::sdist 里缺少内置示例（含 .j2 模板）"; exit 1; }
          uv run --python ${{ matrix.python }} pytest
          uv run --python ${{ matrix.python }} spreadsheet-codegen examples --copy /tmp/sdist-examples
          test -f /tmp/sdist-examples/abs_fpi/templates/ext_body.js.j2 \
            || { echo "::error::spreadsheet-codegen examples --copy 没拷全"; exit 1; }
          uv run --python ${{ matrix.python }} spreadsheet-codegen validate -c /tmp/sdist-examples/basic/example.yaml
