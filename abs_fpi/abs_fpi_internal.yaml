version: 1

# =========================================================================== #
# 规则集：ABS FPI 5A-3-2/5.7   内压（internal tank pressures）
#
# 与 abs_fpi_external.yaml 同构，可以单独生成一本工作簿，也可以被 compose.py
# 合进一本项目工作簿（与内压共用一张 Global 表）。
#
# 已知代价（工具能力边界）：本工具只有 global / local 两层作用域，没有"舱"这一层。
# 一个舱被多个工况引用时，舱数据只能**按工况摊平** —— 同一个舱的参数在每一列各写一遍。
# 表里的 tank_ref 用来标注"这一列是从哪个舱抄来的"。
# =========================================================================== #
excel:
  output: "abs_fpi_internal.xlsx"
  sheets:
    global: "Global Parameter"
    local: "Local Parameter"
    outputs: ["Code", "Summary"]

variables:
  # ------------------------------------------------------------------ 船 / 海 --
  global:
    - name: L
      description: "规范船长 [m]（3-1-1/3）"
      default: 340
      type: float
      suffix: " m"
    - name: B
      description: "规范型宽 [m]"
      default: 64
      type: float
      suffix: " m"
    - name: D
      description: "规范型深 [m]"
      default: 32
      type: float
      suffix: " m"
    - name: d_f
      description: "结构吃水 [m]；规范表按它给出，GM 四点表也按它插值"
      default: 20.559
      type: float
      suffix: " m"
    - name: rho_sea
      description: "海水密度 [kg/m^3]"
      default: 1025
      type: float
      suffix: " kg/m^3"
    - name: g
      description: "重力加速度 [m/s^2]"
      default: 9.81
      type: float
      suffix: " m/s^2"
    - name: Cb
      description: "方形系数 [-]"
      default: 1
      type: float
    - name: rho_g_lo
      description: "k_s = 0.878 对应的 rho g [N/m^3]（1.005 N/cm^2-m = 10050）"
      default: 10050
      type: float
      suffix: " N/m^3"
    - name: rho_g_hi
      description: "k_s 达到 1.0 的 rho g [N/m^3]（1.118 N/cm^2-m = 11180）"
      default: 11180
      type: float
      suffix: " N/m^3"

    # ------------------------------------------------------- 坐标映射（纯替换）--
    - name: ax_x
      description: "规范 x（自 AP）取自模型哪个轴：1=x, 2=y, 3=z"
      default: "1"
      type: string
    - name: ax_y
      description: "规范 y（自中线，向右舷为正）取自模型哪个轴"
      default: "2"
      type: string
    - name: ax_z
      description: "规范 z（基线以上，向上为正）取自模型哪个轴"
      default: "3"
      type: string
    - name: neg_x
      description: "规范 x 是否取反：填 - 表示取反，留空表示不取反"
      default: ""
      type: string
    - name: neg_y
      description: "规范 y 是否取反：填 - 表示取反，留空表示不取反"
      default: ""
      type: string
    - name: neg_z
      description: "规范 z 是否取反：填 - 表示取反，留空表示不取反"
      default: ""
      type: string

  # ---------------------------------------------------------------- 每个工况 --
  local:
    - name: kind
      description: "这个 Case 属于哪一套规则：EXT / INT（多规则集合用时用 case_filter 分流）"
      default: "INT"
      type: string
    - name: draft
      description: "工况吃水 [m]"
      default: 8
      type: float
      suffix: " m"
    - name: mu_deg
      description: "浪向角 [deg]（Table 1A D）"
      default: 90
      type: float
      suffix: " deg"
    - name: k_c
      description: "组合工况相关系数 [-]（Table 1A C）"
      default: 1
      type: float
    - name: k_u
      description: "载荷系数 [-]"
      default: 1.1
      type: float
    - name: beta_VAC
      description: "垂向加速度 ESF [-]（5A-3-A1/3）"
      default: 0.660
      type: float
    - name: beta_LAC
      description: "纵向加速度 ESF [-]"
      default: 0.758
      type: float
    - name: beta_TAC
      description: "横向加速度 ESF [-]"
      default: 0.557
      type: float
    - name: beta_PMO
      description: "纵摇 ESF [-]"
      default: 0.686
      type: float
    - name: beta_RMO
      description: "横摇 ESF [-]"
      default: 0.492
      type: float
    - name: k_esf
      description: "项目对 ESF 的分项系数 [-]"
      default: 1.1
      type: float
    - name: w_v
      description: "垂向加速度权重 [-]（Table 1A B）"
      default: 0.75
      type: float
    - name: w_l
      description: "纵向加速度权重 [-]"
      default: 0.25
      type: float
    - name: w_t
      description: "横向加速度权重 [-]"
      default: 0.75
      type: float
    - name: xi
      description: "舱长方向参考位置 [m]（5.7.2(b)）"
      default: 21
      type: float
      suffix: " m"
    - name: delta_b
      description: "舱宽方向修正 [m]（5.7.2(b)）；无则填 0"
      default: 0
      type: float
      suffix: " m"
    - name: delta_h
      description: "舱高方向修正 [m]（5.7.2(b)）；无则填 0"
      default: 0
      type: float
      suffix: " m"

    # ---- 舱数据：按工况摊平（同一个舱被几个工况用到就写几遍）----
    - name: tank_ref
      description: "本列数据来自哪个舱（仅标注；样例 WBT6 / WBT7 / COT1）"
      default: "WBT6"
      type: string
    - name: rho_tank
      description: "舱内液体密度 [kg/m^3]"
      default: 1025
      type: float
      suffix: " kg/m^3"
    - name: l_tank
      description: "舱长 [m]（Fig. 11）"
      default: 42
      type: float
      suffix: " m"
    - name: b_tank
      description: "舱宽 [m]（Fig. 11）"
      default: 32
      type: float
      suffix: " m"
    - name: h_tank
      description: "舱高 [m]（Fig. 11）"
      default: 32
      type: float
      suffix: " m"
    - name: eta_deck
      description: "甲板以上高度 [m]"
      default: 0
      type: float
      suffix: " m"
    - name: eta_overflow
      description: "溢流管高度 [m]；Fig. 12 要求取 2/3 且不低于 760 mm"
      default: 0
      type: float
      suffix: " m"
    - name: C_dp
      description: "舱形系数 [-]（5.7.2(d)）：矩形 1.0，J 形 0.7"
      default: 1
      type: float
    - name: C_ru
      description: "舱形系数 [-]（5.7.2(d)）：矩形 1.0，U 形 0.7"
      default: 1
      type: float
    - name: p_vp
      description: "真空/压力阀整定压力 [N/cm^2]"
      default: 0
      type: float
      suffix: " N/cm^2"
    - name: GM_full_in
      description: "完整稳性 GM [m]；填 0 时用规范估算 0.12 B"
      default: 0
      type: float
      suffix: " m"
    - name: k_r_in
      description: "横摇惯性半径 [m]；填 0 时用规范估算（0.35 B / 0.45 B）"
      default: 0
      type: float
      suffix: " m"
    - name: tank_is_ballast
      description: "压载舱 1 / 货舱 0；决定 k_s 是否取 1"
      default: 1
      type: int
    - name: member_11_17
      description: "构件是否属于 5.7 表 3 的 11..17 项（1 = 是）"
      default: 0
      type: int

templates:
  - name: genie_int
    description: "ABS FPI 5A-3-2/5.7 内压 -- GeniE 强度函数体"
    output_sheet: "Code"
    start_cell: "B2"
    direction: "horizontal"
    write_case_headers: true
    engine: "excel"
    filename: "{{ case_name }}.js"
    template_file: "templates/int_body.js.j2"

  - name: int_summary
    description: "内压工况输入汇总（Markdown）"
    output_sheet: "Summary"
    start_cell: "B2"
    direction: "vertical"
    write_case_headers: true
    engine: "excel"
    filename: "{{ case_name }}_summary.md"
    template_file: "templates/int_summary.md.j2"
